name: Shared CI Workflow

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions to test'
        required: false
        type: string
        default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      operating-systems:
        description: 'JSON array of operating systems to test'
        required: false
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      legacy-python-versions:
        description: 'JSON array of Python versions that need a pinned Ubuntu image'
        required: false
        type: string
        default: '["3.10"]'
      legacy-python-os:
        description: 'Ubuntu image used for legacy Python versions'
        required: false
        type: string
        default: 'ubuntu-24.04'
      package-name:
        description: 'Package import name; also enables credential-gated integration tests'
        required: true
        type: string
      extra-index-url:
        description: 'Additional PyPI index URL (e.g., https://test.pypi.org/simple/)'
        required: false
        type: string
        default: ''
    secrets:
      ZENODO_SYNC_SANDBOX:
        description: 'Zenodo sandbox token; enables the slow integration tests'
        required: false
      ZENODO_SYNC_EMAIL:
        description: 'Zenodo account email that owns the sandbox token'
        required: false

jobs:
  # Python 3.10 is end-of-life and actions/python-versions only builds new
  # Ubuntu images for versions that are still supported, so 3.10 has no
  # Ubuntu 26.04 build. Keep it on the pinned Ubuntu image while newer
  # versions follow the requested operating systems (ubuntu-latest maps to
  # newer images over time).
  prepare:
    name: Prepare test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        env:
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          OPERATING_SYSTEMS: ${{ inputs.operating-systems }}
          LEGACY_PYTHON_VERSIONS: ${{ inputs.legacy-python-versions }}
          LEGACY_PYTHON_OS: ${{ inputs.legacy-python-os }}
        run: |
          matrix=$(python3 - <<'PY'
          import json, os

          versions = json.loads(os.environ["PYTHON_VERSIONS"])
          systems = json.loads(os.environ["OPERATING_SYSTEMS"])
          legacy = set(json.loads(os.environ["LEGACY_PYTHON_VERSIONS"]))
          legacy_os = os.environ["LEGACY_PYTHON_OS"]
          has_ubuntu = any(s.startswith("ubuntu-") for s in systems)

          include = []
          for version in versions:
              for system in systems:
                  if version in legacy and system.startswith("ubuntu-"):
                      continue
                  include.append({"python-version": version, "os": system})
              if version in legacy and has_ubuntu:
                  include.append({"python-version": version, "os": legacy_os})

          print(json.dumps({"include": include}))
          PY
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -n "${{ inputs.extra-index-url }}" ]; then
          pip install --extra-index-url ${{ inputs.extra-index-url }} -e ".[dev]"
        else
          pip install -e ".[dev]"
        fi
      shell: bash

    - name: Verify generated scripts
      run: |
        echo "Checking generated scripts against the pinned devtools revision..."
        python scripts/sync.py --check

    - name: Run quality gate
      env:
        PYTHONIOENCODING: utf-8
        ZENODO_SYNC_SANDBOX: ${{ secrets.ZENODO_SYNC_SANDBOX }}
        ZENODO_SYNC_EMAIL: ${{ secrets.ZENODO_SYNC_EMAIL }}
      shell: bash
      run: |
        args=""
        if [ "${{ inputs.package-name }}" = "zenodo_sync" ] && [ -n "$ZENODO_SYNC_SANDBOX" ]; then
          echo "Zenodo credentials present: including slow integration tests"
          args="--include-slow"
        fi
        python scripts/check_ci.py --ci $args
