# Co-installability gate for users who install several CausalIQ packages.
# The packages are currently published to Test PyPI only; switch the index
# to production PyPI once the stable 0.x.0 releases exist.
name: Ecosystem co-install

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  install:
    name: Install the released ecosystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install every CausalIQ package in one resolution
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install
          --index-url https://test.pypi.org/simple/
          --extra-index-url https://pypi.org/simple/
          causaliq-core causaliq-workflow causaliq-data
          causaliq-knowledge causaliq-analysis causaliq-discovery
          causaliq-whatif causaliq-research zenodo-sync
      - name: Import each package
        run: |
          python - <<'PY'
          import importlib

          packages = [
              "causaliq_core",
              "causaliq_workflow",
              "causaliq_data",
              "causaliq_knowledge",
              "causaliq_analysis",
              "causaliq_discovery",
              "causaliq_whatif",
              "causaliq_research",
              "zenodo_sync",
          ]
          for name in packages:
              importlib.import_module(name)
              print(f"{name}: ok")
          PY
      - name: Check the dependency graph
        run: python -m pip check
